# Local development only. Production is the Dockerfile, built by Coolify -
# this file is in .dockerignore and never reaches the image.
#
#   docker compose up -d      -> http://localhost:8010
#
# There is no database service: the site's content lives in config/portfolio.php
# and sessions are cookie-based, so nothing here needs MySQL.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: portfolio_app
    restart: unless-stopped
    # Source is mounted so edits appear without rebuilding. Assets still come
    # from `npm run dev` or `npm run build` on the host.
    volumes:
      - .:/var/www
    working_dir: /var/www
    ports:
      - "8010:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    entrypoint: []
    command: php artisan serve --host=0.0.0.0 --port=8000
