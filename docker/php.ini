; Production PHP settings for the container.

; Do not advertise the PHP version in response headers.
expose_php = Off

; The application code cannot change while the container runs, so opcache
; never needs to stat files for freshness.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Errors go to the container log, never to the response body.
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Comfortable headroom for the largest thing served (a 1.9MB model) without
; being generous enough to matter.
memory_limit = 256M
post_max_size = 12M
upload_max_filesize = 12M
